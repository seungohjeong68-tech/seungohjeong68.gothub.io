<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나의 동반 계획</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f1;color:#20332a;font:16px/1.55 system-ui,'Malgun Gothic',sans-serif}header{background:#234638;color:white;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px max(20px,calc((100vw - 1080px)/2))}header strong{font-size:1.25rem;white-space:nowrap}#clock{display:flex;align-items:center;gap:10px}#date{background:#ffffff16;color:white}time{font-variant-numeric:tabular-nums;white-space:nowrap}nav,main{max-width:1120px;margin:auto;padding:16px 20px}nav{display:flex;gap:8px;border-bottom:1px solid #dbe2d9}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:9px 13px;background:#e7ede4;color:#234638}button:hover{filter:brightness(.96)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #377c58;outline-offset:2px}.primary,[aria-current=true]{background:#28513f;color:white}h1{font-size:clamp(1.8rem,5vw,2.7rem);margin:12px 0 22px;letter-spacing:-.055em}h2{font-size:1.2rem;margin:0 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:white;border:1px solid #dae3d9;border-radius:16px;padding:18px;margin-bottom:14px;min-width:0}.bar,.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.row{justify-content:space-between;border-bottom:1px solid #ecf0ea;padding:10px 0;overflow-wrap:anywhere}.row:last-child{border:0}.row label{flex:1;min-width:120px}.row input{margin-right:8px;accent-color:#28513f}.muted,small{color:#53665b}.done{text-decoration:line-through;color:#53665b}.empty{color:#53665b;margin:8px 0}.capture{display:flex;gap:8px}.capture input{flex:1;min-width:0}input:not([type=checkbox]),select,textarea{background:#fafcf9;color:inherit;border:1px solid #cad8cb;padding:8px;border-radius:8px;max-width:100%}.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.day{text-align:left;align-self:stretch;min-height:76px;padding:6px;background:#eff4ed;overflow:hidden}.day[aria-pressed=true]{outline:2px solid #28513f;outline-offset:-2px}.day strong,.day span{display:block}.day span{font-size:.78rem;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.week{text-align:center;color:#53665b}.months{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:12px 0}.tabs{margin-bottom:16px}dialog{border:1px solid #dae3d9;border-radius:16px;width:min(500px,94vw);max-height:90vh;color:inherit}dialog::backdrop{background:#152d24aa}dialog label{display:grid;gap:4px;margin:10px 0}#status{position:fixed;bottom:12px;right:12px;background:#234638;color:white;border-radius:8px;padding:8px 14px}#status:empty{display:none}@media(max-width:640px){header{padding:12px}nav,main{padding:10px 12px}.grid{grid-template-columns:1fr}.months{grid-template-columns:repeat(4,1fr)}.card{padding:12px}.day{min-height:56px}.day span{font-size:.7rem}#clock{font-size:.9rem}}

:root{--cream:#fff3e1;--paper:#fffdf8;--ink:#38261e;--soft:#ffead5;--line:#e9ccb1;--orange:#a84214}
body{background:var(--cream);color:var(--ink);padding:clamp(0px,4vw,52px) 12px}
.planner-shell{max-width:1060px;margin:auto;background:var(--paper);border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 18px 48px #783c1412}
header{background:var(--soft);color:var(--ink);padding:clamp(14px,4vw,28px);flex-wrap:wrap}
header strong{font-size:clamp(1.15rem,4vw,1.7rem);letter-spacing:-.045em}
#date{background:var(--paper);color:var(--ink)}
nav,main{padding-inline:clamp(12px,4vw,32px)}
nav,.card,dialog,.row{border-color:var(--line)}
nav{flex-wrap:wrap}
.card{background:var(--paper);border-radius:16px}
.muted,small,.empty,.week,.done{color:#6a5141}
button,.day{background:var(--soft);color:#743614}
.primary,[aria-current=true],#status{background:var(--orange);color:white}
.day[aria-pressed=true],button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline-color:var(--orange)}
.row input{accent-color:var(--orange)}
input:not([type=checkbox]),select,textarea{background:var(--paper);border-color:var(--line)}
header{border-top:5px solid var(--orange)}
nav button{border-radius:0;background:transparent;border-bottom:3px solid transparent}
nav [aria-current=true]{background:transparent;color:var(--orange);border-bottom-color:var(--orange);font-weight:800}
time{font-size:1.2rem;font-weight:750}
.today-grid .card{border-top:4px solid #c4774d;min-height:140px}
.today-grid .card+.card{border-top-color:#527060}
.capture-card{background:#fff2df;border-left:4px solid #c4774d}
.capture input,.capture button{min-height:44px}
.day[aria-current=date] strong{color:var(--orange);text-decoration:underline;text-underline-offset:3px}
.day .day-count{display:none}
@media(max-width:620px){.day .day-entry{display:none}.day .day-count{display:block}.day{text-align:center;padding-inline:1px}}
@media(max-width:430px){body{padding:0}.planner-shell{border-radius:0;border-inline:0;min-height:100vh}nav button{flex:1 1 auto;padding-inline:8px}}
.monthly-scroll{overflow:auto;max-height:68vh;border:1px solid var(--line);border-radius:10px}
.monthly-table{border-collapse:separate;border-spacing:0;width:100%;table-layout:fixed;min-width:calc(6.5rem + 8rem * var(--menu-count));font-size:.9rem}
.monthly-table th,.monthly-table td{padding:7px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);vertical-align:top}
.monthly-table th{background:#fff2df;text-align:left}
.monthly-table thead th{position:sticky;top:0;z-index:2;overflow-wrap:anywhere}
.monthly-table th:first-child{position:sticky;left:0;width:6.5rem;z-index:1}
.monthly-table thead th:first-child{z-index:3}
.monthly-table tr.is-today>th{background:#f9dbbc}
.monthly-table tr.is-selected>td{background:#fff5e8}
.monthly-table button{width:100%;text-align:left;overflow-wrap:anywhere}
.monthly-table td button+button{margin-top:4px}
.monthly-table .cell-add{color:var(--orange);background:transparent;text-align:center;padding:3px}
.month-view-controls{margin-bottom:12px}
.month-view-controls button[aria-pressed=true]{background:var(--orange);color:white;font-weight:700}
.month>.day{background:#fff2df}
.month>.day[aria-pressed=true]{outline-color:var(--orange);background:#ffdcb9}
</style>
</head>
<body>
<div class="planner-shell">
<header><strong>나의 동반 계획</strong><div id="clock"><button id="date" aria-label="이번 달 달력 열기"></button><time id="time"></time></div></header>
<nav aria-label="주 메뉴" id="nav"></nav>
<main id="main"></main>
</div>
<dialog id="dialog"></dialog>
<div id="status" role="status"></div>
<script>
"use strict";

const $ = selector => document.querySelector(selector);
const escape = value => String(value ?? "").replace(/[&<>"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[char]);
const pad = value => String(value).padStart(2,"0");
const dateKey = date => [date.getFullYear(),pad(date.getMonth()+1),pad(date.getDate())].join("-");
const today = () => dateKey(new Date());
const initial = {items:[],menus:[]};
const storageKey = "companion-planner-v1";
let data;
let storageAvailable = true;
try { data = JSON.parse(localStorage.getItem(storageKey) || JSON.stringify(initial)); }
catch { data = initial; storageAvailable = false; }
const newId = () => globalThis.crypto?.randomUUID?.() || Date.now().toString(36) + "-" + Math.random().toString(36).slice(2);
let page = "today";
let plan = "month";
let monthViewMode = "list";
let month = today().slice(0,7);
let selected = "";
let filter = "";
let currentMenu = "";

let toastTimer;
const kinds = {event:"일정",task:"할 일",idea:"아이디어",life:"인생",year:"연간",month:"월간"};
const menus = {reading:"독서",travel:"여행",custom:"직접 만들기"};
const defaultColumns = ["성경","교수","지도사","재무","건강","비고"];
const notesColumnId = "monthly-default-5";

function monthlyMenus(existing) {
  const defaults = defaultColumns.map((name,index)=>{
    const id = "monthly-default-"+index;
    const match = existing.find(menu=>menu.id===id || menu.name===name);
    return match || {id,name,type:"custom",favorite:false};
  });
  return [...defaults,...existing.filter(menu=>!defaults.includes(menu))];
}
data.menus = monthlyMenus(data.menus);

function toast(message) {
  $("#status").textContent = message;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $("#status").textContent = "",4000);
}

function save() {
  try {
    localStorage.setItem(storageKey,JSON.stringify(data));
  } catch {
    toast("기록을 저장할 수 없습니다. 브라우저 저장 공간을 확인해 주세요.");
  }
  render();
}

function tick() {
  const now = new Date();
  $("#date").textContent = now.toLocaleDateString("ko-KR",{month:"long",day:"numeric",weekday:"long"});
  $("#time").textContent = pad(now.getHours())+":"+pad(now.getMinutes());
  $("#time").dateTime = now.toISOString();
}
tick();

const button = (label,action,value="",css="") => '<button type="button" class="'+css+'" data-action="'+action+'" data-value="'+escape(value)+'">'+escape(label)+'</button>';
const option = (value,label,current) => '<option value="'+escape(value)+'" '+(value===current?"selected":"")+'>'+escape(label)+'</option>';
const card = (title,body,style="") => '<section class="card '+style+'"><h2>'+title+'</h2>'+body+'</section>';
const empty = message => '<p class="empty">'+message+'</p>';
const menuFor = id => data.menus.find(menu=>menu.id===id);
const itemFor = id => data.items.find(item=>item.id===id);
const appointments = () => data.items.filter(item=>item.kind==="event").sort((a,b)=>a.date.localeCompare(b.date)||(a.time||"").localeCompare(b.time||""));

function taskRow(item,showDate=false) {
  const detail = [showDate ? item.date || "" : "", menuFor(item.menu)?.name, itemFor(item.parent)?.title, item.state && item.state!=="미정" ? item.state : ""].filter(Boolean).join(" · ");
  const label = '<span class="'+(item.done?"done":"")+'">'+escape(item.title)+'</span>'+ (detail ? '<br><small>'+escape(detail)+'</small>' : "");
  const check = item.kind==="task" ? '<input type="checkbox" data-toggle="'+escape(item.id)+'" '+(item.done?"checked":"")+'>':"";
  return '<div class="row"><label>'+check+label+'</label><div class="bar">'+(item.kind==="task"&&!item.done&&item.date===today()?button("내일","tomorrow",item.id):"")+button("편집","edit",item.id)+'</div></div>';
}

function eventRow(event,showDate=false) {
  return '<div class="row"><span>'+escape((showDate?event.date+" ":"")+(event.time||"종일")+" "+event.title)+'</span>'+button("편집","edit",event.id)+'</div>';
}

function capture() {
  return '<form id="capture" class="capture"><input name="title" aria-label="아이디어" required maxlength="200" placeholder="떠오른 생각이나 나중에 할 일"><button class="primary">기록</button></form>';
}

function dayEvents(key) {
  return appointments().filter(event=>event.date===key);
}

function todayView() {
  const key = today();
  const tasks = data.items.filter(item=>item.kind==="task"&&item.date===key);
  const overdue = data.items.filter(item=>item.kind==="task"&&!item.done&&item.date&&item.date<key);
  return '<h1>오늘</h1><div class="grid today-grid">'+card("일정",button("+ 일정 추가","new","event","primary")+(dayEvents(key).map(event=>eventRow(event)).join("")||empty("오늘 잡힌 일정이 없어요.")))+
    card("할 일",button("+ 할 일 추가","new","task","primary")+(tasks.map(item=>taskRow(item)).join("")||empty("오늘 할 일을 추가해 보세요.")))+'</div>'+
    (overdue.length?card("날짜가 지난 할 일",overdue.map(item=>taskRow(item,true)).join("")):"")+card("한 줄 기록",capture(),"capture-card");
}

function calendarGrid(year,index,count,entriesByDate) {
  const weekdays = [..."일월화수목금토"];
  const offset = new Date(year,index-1,1).getDay();
  const days = Array.from({length:count},(_,i)=>{
    const key = month+"-"+pad(i+1);
    const entries = entriesByDate.get(key)||[];
    const label = (i+1)+"일 "+weekdays[(offset+i)%7]+"요일, "+entries.length+"개";
    return '<button type="button" class="day" data-action="day" data-value="'+key+'" aria-label="'+label+'" aria-pressed="'+(key===selected)+'"'+(key===today()?' aria-current="date"':'')+'><strong>'+(i+1)+'</strong>'+
      entries.slice(0,2).map(item=>'<span class="day-entry">'+escape(monthEntryLabel(item))+'</span>').join("")+
      (entries.length>2?'<span class="day-entry">+'+(entries.length-2)+'개</span>':"")+
      (entries.length?'<span class="day-count">'+entries.length+'개</span>':"")+'</button>';
  }).join("");
  return '<div class="month">'+weekdays.map(day=>'<div class="week">'+day+'</div>').join("")+'<div aria-hidden="true"></div>'.repeat(offset)+days+'</div>';
}

function monthEntryLabel(item) {
  const prefix = item.kind==="event" ? (item.time||"종일")+" " : item.done ? "✓ " : "";
  return prefix+item.title;
}

function monthlyView() {
  const [year, index] = month.split("-").map(Number);
  const count = new Date(year,index,0).getDate();
  const notesColumn = data.menus.find(menu=>menu.id===notesColumnId || menu.name==="비고");
  const menuId = item=>item.menu||notesColumn?.id||"";
  const matchesFilter = item=>!filter||menuId(item)===filter;
  const sourceItems = data.items.filter(item=>item.kind==="task"&&matchesFilter(item));
  const monthItems = sourceItems.filter(item=>item.date?.startsWith(month)).sort((a,b)=>a.date.localeCompare(b.date));
  const monthEvents = appointments().filter(event=>event.date.startsWith(month)&&matchesFilter(event));
  const undated = sourceItems.filter(item=>!item.date&&item.period===month);
  const columns = data.menus.filter(menu=>!filter||menu.id===filter);
  const entriesByDate = new Map();
  for(const item of [...monthEvents,...monthItems]) {
    if(!entriesByDate.has(item.date)) entriesByDate.set(item.date,[]);
    entriesByDate.get(item.date).push(item);
  }
  const days = monthViewMode==="list" ? Array.from({length:count},(_,i)=>{
    const key = month+"-"+pad(i+1);
    const label = (i+1)+"일 "+[..."일월화수목금토"][new Date(year,index-1,i+1).getDay()];
    const cells = columns.map(menu=>{
      const entries = (entriesByDate.get(key)||[]).filter(item=>menuId(item)===menu.id);
      const list = entries.map(item=>button(monthEntryLabel(item),"edit",item.id,item.done?"done":"")).join("");
      return '<td>'+list+'<button type="button" class="cell-add" data-action="newCell" data-date="'+key+'" data-menu="'+escape(menu.id)+'" aria-label="'+escape(label+" "+menu.name+" 할 일 추가")+'">+</button></td>';
    }).join("");
    return '<tr class="'+(key===today()?"is-today ":"")+(key===selected?"is-selected":"")+'"><th scope="row">'+button(label,"day",key)+'</th>'+cells+'</tr>';
  }).join("") : "";
  const viewControls = '<div class="bar month-view-controls" role="group" aria-label="월간 보기 방식">'+
    [["calendar","달력 보기"],["list","일별 표 보기"]].map(([value,label])=>'<button type="button" data-action="monthView" data-value="'+value+'" aria-pressed="'+(value===monthViewMode)+'">'+label+'</button>').join("")+'</div>';
  const monthContent = monthViewMode==="calendar" ? calendarGrid(year,index,count,entriesByDate) :
    '<div class="monthly-scroll" tabindex="0" role="region" aria-label="'+year+'년 '+index+'월 계획표"><table class="monthly-table" style="--menu-count:'+columns.length+'"><thead><tr><th scope="col">날짜</th>'+
      columns.map(menu=>'<th scope="col">'+escape(menu.name)+'</th>').join("")+'</tr></thead><tbody>'+days+'</tbody></table></div>';
  const items = selected?monthItems.filter(item=>item.date===selected):monthItems;
  const visibleEvents = selected?monthEvents.filter(event=>event.date===selected):monthEvents;
  const goals = data.items.filter(item=>item.kind==="month"&&item.period===month);
  return card("월간 계획표",'<div class="bar">'+button("이전 해","year","-1")+'<strong>'+year+'년</strong>'+button("다음 해","year","1")+button("+ 메뉴 열 추가","addMenu","", "primary")+'<select id="filter" aria-label="메뉴별 보기">'+option("","전체",filter)+data.menus.map(menu=>option(menu.id,menu.name,filter)).join("")+'</select></div><div class="months">'+
    Array.from({length:12},(_,i)=>button((i+1)+"월","month",year+"-"+pad(i+1),i+1===index?"primary":"")).join("")+
    '</div>'+viewControls+monthContent)+
    card(selected ? Number(selected.slice(-2))+"일 일정과 할 일" : index+"월 전체 일정과 할 일",
      '<div class="bar">'+button("+ 일정 추가","new","event")+button("+ 할 일 추가","new","task","primary")+(selected?button("월 전체","clearDay"):"")+'</div>'+
      (visibleEvents.map(event=>eventRow(event,!selected)).join("")+items.map(item=>taskRow(item,!selected)).join("")||empty("등록된 일정과 할 일이 없어요.")))+
    card("날짜 미정",undated.map(item=>taskRow(item)).join("")||empty("이번 달에 날짜를 정하지 않은 일이 없어요."))+
    card("이번 달 계획",button("+ 월간 계획","new","month","primary")+goals.map(item=>taskRow(item)).join(""));
}

function planView() {
  const tabs = [["month","월간"],["year","연간"],["life","인생"]];
  return '<h1>계획</h1><div class="bar tabs">'+tabs.map(([key,label])=>button(label,"plan",key,key===plan?"primary":"")).join("")+'</div>'+
    (plan==="month"?monthlyView():card(kinds[plan]+" 계획",button("+ 계획 추가","new",plan,"primary")+
      (data.items.filter(item=>item.kind===plan).map(item=>'<div class="muted">'+escape(item.period||"")+'</div>'+taskRow(item)).join("")||empty("계획을 추가해 보세요."))));
}

function moreView() {
  const menu = menuFor(currentMenu);
  if(menu) {
    const entries = data.items.filter(item=>item.menu===menu.id);
    return '<h1>'+escape(menu.name)+'</h1><div class="bar tabs">'+button("메뉴 목록","menu","")+button("+ 할 일","new","task","primary")+button("+ 메모","new","idea")+button("+ 일정","new","event")+'</div>'+
      card(menus[menu.type],entries.map(item=>item.kind==="event"?eventRow(item,true):taskRow(item,true)).join("")||empty("날짜가 있는 할 일은 오늘과 월간 달력에 표시돼요."));
  }
  return '<h1>더보기</h1><div class="grid">'+card("내 메뉴",button("+ 메뉴 추가","addMenu","","primary")+
    data.menus.map((entry,index)=>'<div class="row">'+button((entry.favorite?"★ ":"")+entry.name,"menu",entry.id)+'<div class="bar">'+button(entry.favorite?"즐겨찾기 해제":"즐겨찾기","favorite",entry.id)+(index?button("위로","moveMenu",entry.id):"")+button("편집","editMenu",entry.id)+'</div></div>').join(""))+
    card("데이터",'<p class="muted">이 브라우저에 저장합니다. 내보낸 파일을 다른 기기에서 가져올 수 있어요.</p><div class="bar">'+button("백업 파일 내보내기","export")+button("백업 파일 가져오기","import")+'<input type="file" id="file" accept=".json,application/json" hidden></div>')+'</div>';
}

function render() {
  const tabs = [["today","오늘"],["plan","계획"],["idea","아이디어"],["more","더보기"]];
  $("#nav").innerHTML = tabs.map(([key,label])=>'<button data-action="page" data-value="'+key+'" '+(page===key?'aria-current="true"':"")+'>'+label+'</button>').join("");
  const favorites = data.menus.filter(menu=>menu.favorite);
  const ideas = () => '<h1>아이디어</h1>'+card("한 줄 기록",capture())+card("저장한 아이디어",
    data.items.filter(item=>item.kind==="idea"&&!item.menu).map(item=>taskRow(item)).join("")||empty("떠오른 생각을 적어 보세요."));
  const views = {today:todayView,plan:planView,idea:ideas,more:moreView};
  $("#main").innerHTML = (favorites.length?'<div class="bar tabs">'+favorites.map(menu=>button(menu.name,"menu",menu.id)).join("")+'</div>':"")+views[page]();
}

function openDialog(title,body,commit,remove) {
  const dialog = $("#dialog");
  dialog.innerHTML = '<h2>'+title+'</h2><form>'+body+'<div class="bar"><button class="primary">저장</button><button type="button" class="cancel">닫기</button>'+(remove?'<button type="button" class="remove">삭제</button>':"")+'</div></form>';
  dialog.querySelector(".cancel").onclick = ()=>dialog.close();
  if(remove) dialog.querySelector(".remove").onclick = ()=>{
    if(confirm("이 항목을 삭제할까요?")) { dialog.close();remove(); }
  };
  dialog.querySelector("form").onsubmit = event=>{
    event.preventDefault();
    if(commit(Object.fromEntries(new FormData(event.currentTarget)))!==false) dialog.close();
  };
  dialog.showModal();
}

function editItem(kind,id,preset) {
  const existing = itemFor(id);
  const item = existing || {kind,title:"",date:kind==="event"||kind==="task"?(page==="today"?today():selected|| (kind==="event"?today():"")):"",period:kind==="year"?month.slice(0,4):kind==="month"||page==="plan"?month:"",menu:page==="more"?currentMenu:"",parent:"",details:"",state:"미정"};
  if(preset) Object.assign(item,preset);
  const field = (label,name,type,value,attributes="")=>'<label>'+label+'<input name="'+name+'" type="'+type+'" value="'+escape(value)+'" '+attributes+'></label>';
  const goalOptions = data.items.filter(goal=>({year:["life"],month:["year","life"],task:["month","year","life"],idea:["month","year","life"]}[kind]||[]).includes(goal.kind));
  const menuType = menuFor(item.menu)?.type;
  const canTask = ["task","idea"].includes(kind);
  openDialog(existing?"항목 편집":kinds[kind]+" 추가",field("제목","title","text",item.title,"required maxlength=200")+
    (kind==="event"?field("날짜","date","date",item.date,"required")+field("시간","time","time",item.time):"")+
    (canTask?field("실행 날짜","date","date",item.date)+(kind==="idea"?'<label><span><input type="checkbox" name="convert"> 할 일로 바꾸기</span></label>':""):"")+
    (kind==="year"?field("연도","period","number",item.period,"required min=1900 max=9999"):kind==="month"||canTask?field("해당 월","period","month",item.period,kind==="month"?"required":""):"")+
    (canTask||kind==="event"?'<label>메뉴<select name="menu">'+option("","선택 안 함",item.menu)+data.menus.map(menu=>option(menu.id,menu.name,item.menu)).join("")+'</select></label>':"")+
    (goalOptions.length?'<label>상위 계획<select name="parent">'+option("","선택 안 함",item.parent)+goalOptions.map(goal=>option(goal.id,kinds[goal.kind]+" · "+goal.title,item.parent)).join("")+'</select></label>':"")+
    (menuType==="reading"?'<label>독서 상태<select name="state">'+["미정","읽고 싶음","읽는 중","완독"].map(state=>option(state,state,item.state)).join("")+'</select></label>':"")+
    '<label>'+(menuType==="travel"?"예약 정보·준비물":menuType==="reading"?"한 줄 감상":"메모")+'<textarea name="details" maxlength="4000">'+escape(item.details)+'</textarea></label>',
    values=>{
      if(!values.title.trim()) return false;
      const {convert,...fields}=values;
      const updated = {...item,...fields,title:fields.title.trim(),kind:convert||kind==="idea"&&fields.date?"task":kind,id:existing?.id||newId()};
      if(existing) Object.assign(existing,updated);else data.items.push(updated);
      save();
    },existing?()=>{
      data.items=data.items.filter(entry=>entry.id!==id);
      data.items.forEach(entry=>{if(entry.parent===id)entry.parent="";});
      save();
    }:null);
}

function editMenu(id) {
  const menu = menuFor(id);
  openDialog(menu?"메뉴 편집":"메뉴 추가",'<label>양식<select name="type">'+Object.entries(menus).map(([key,label])=>option(key,label,menu?.type||"custom")).join("")+'</select></label><label>메뉴 이름<input name="name" maxlength="40" placeholder="양식 이름 사용" value="'+escape(menu?.name)+'"></label>',values=>{
    const name = values.name.trim()||(values.type==="custom"?"":menus[values.type]);
    if(!name) {toast("메뉴 이름을 입력해 주세요.");return false;}
    if(menu) Object.assign(menu,{name,type:values.type});else data.menus.push({id:newId(),name,type:values.type,favorite:false});
    save();
  },menu?()=>{
    data.items.forEach(item=>{if(item.menu===id)item.menu="";});
    data.menus=data.menus.filter(entry=>entry.id!==id);
    if(filter===id)filter="";
    save();
  }:null);
}

function exportData() {
  const url = URL.createObjectURL(new Blob([JSON.stringify({version:1,items:data.items,menus:data.menus},null,2)],{type:"application/json"}));
  const link = document.createElement("a");
  link.href=url;
  link.download="나의-플래너-"+today()+".json";
  link.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

async function importData(file) {
  try {
    if(!file||file.size>20_000_000) throw Error("file");
    const imported = JSON.parse(await file.text());
    if(imported.version!==1||!Array.isArray(imported.items)||!Array.isArray(imported.menus)) throw Error("format");
    const ids = new Set();
    const valid = (value,max)=>typeof value==="string"&&value.length<=max;
    const unique = id=>{
      if(!valid(id,100)||!id||ids.has(id)) return false;
      ids.add(id);
      return true;
    };
    if(!imported.menus.every(menu=>menu&&unique(menu.id)&&valid(menu.name,40)&&Object.hasOwn(menus,menu.type)&&typeof menu.favorite==="boolean")||
       !imported.items.every(item=>item&&unique(item.id)&&Object.hasOwn(kinds,item.kind)&&valid(item.title,200)&&
         ["date","period","menu","parent","details","state","time"].every(field=>valid(item[field]??"",4000))&&
         (!item.date||/^\d{4}-\d{2}-\d{2}$/.test(item.date))&&(!item.period||/^\d{4}(-\d{2})?$/.test(item.period))&&
         (item.kind!=="event"||Boolean(item.date))&&(!item.time||/^([01]\d|2[0-3]):[0-5]\d$/.test(item.time))&&
         (item.done===undefined||typeof item.done==="boolean"))) throw Error("record");
    if(!confirm("현재 기록을 백업 파일의 기록으로 바꿀까요?")) return;
    data={...data,items:imported.items,menus:monthlyMenus(imported.menus)};
    currentMenu="";
    filter="";
    save();
    toast("백업을 가져왔어요.");
  } catch {
    toast("플래너에서 내보낸 백업 파일인지 확인해 주세요.");
  }
}

const actions = {
  page(value) {page=value;if(page==="more")currentMenu="";render();},
  plan(value) {plan=value;render();},
  monthView(value) {
    if(value!=="calendar"&&value!=="list") return;
    monthViewMode=value;
    render();
    $('.month-view-controls [aria-pressed="true"]')?.focus();
  },
  month(value) {month=value;selected="";render();},
  year(value) {actions.month(String(Number(month.slice(0,4))+Number(value))+month.slice(4));},
  day(value) {selected=value;render();},
  clearDay() {selected="";render();},
  new(value) {editItem(value);},
  newCell(_,control) {
    const {date,menu}=control.dataset;
    editItem("task",undefined,{date,menu,period:date.slice(0,7)});
  },
  edit(id) {const item=itemFor(id);if(item)editItem(item.kind,id);},
  tomorrow(id) {
    const item=itemFor(id);
    if(!item) return;
    const date=new Date();
    date.setDate(date.getDate()+1);
    item.date=dateKey(date);
    item.period=item.date.slice(0,7);
    save();
  },
  addMenu() {editMenu();},
  editMenu(id) {editMenu(id);},
  menu(id) {currentMenu=id;page="more";render();},
  favorite(id) {const menu=menuFor(id);if(menu){menu.favorite=!menu.favorite;save();}},
  moveMenu(id) {
    const index=data.menus.findIndex(menu=>menu.id===id);
    if(index>0) {
      [data.menus[index-1],data.menus[index]]=[data.menus[index],data.menus[index-1]];
      save();
    }
  },
  export:exportData,
  import() {$("#file").click();}
};

let dayAtLastTick=today();
setInterval(()=>{
  tick();
  const day=today();
  if(day!==dayAtLastTick) {
    dayAtLastTick=day;
    if(page==="today")render();
  }
},1000);

$("#date").onclick=()=>{
  page="plan";
  plan="month";
  filter="";
  actions.month(today().slice(0,7));
};
document.addEventListener("click",event=>{
  const control=event.target.closest("[data-action]");
  if(control) actions[control.dataset.action]?.(control.dataset.value,control);
});
document.addEventListener("change",event=>{
  const control=event.target;
  if(control.id==="filter") {filter=control.value;render();}
  if(control.id==="file"&&control.files.length) {void importData(control.files[0]);control.value="";}
  if(control.dataset.toggle) {
    const item=itemFor(control.dataset.toggle);
    if(item){item.done=control.checked;save();}
  }
});
document.addEventListener("submit",event=>{
  if(event.target.id!=="capture") return;
  event.preventDefault();
  const title=new FormData(event.target).get("title").trim();
  if(!title)return;
  data.items.push({id:newId(),kind:"idea",title,date:"",period:"",menu:"",parent:"",details:"",state:""});
  save();
  toast("아이디어에 저장했어요.");
});
window.addEventListener("storage",event=>{
  if(event.key===storageKey&&event.newValue) {data=JSON.parse(event.newValue);render();}
});
render();
if(!storageAvailable) toast("이 브라우저에서 저장된 기록을 읽을 수 없어요. 기록은 백업 파일로 보관할 수 있어요.");



</script>
